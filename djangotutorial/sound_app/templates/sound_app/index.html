<div style="padding: 50px; text-align: center; min-height: 100vh;">
    <h1>Upload media</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
    <p>Classification result: {{ prediction }}</p>
</div>
