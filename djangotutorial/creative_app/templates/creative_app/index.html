<div style="background-color: {{ color }}; padding: 50px; text-align: center; min-height: 100vh; transition: background 1s;">
    <h1>Atmosphere Generator</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}  <!-- Renders form fields as paragraphs -->
        <button type="submit">Generate Color</button>
    </form>
    <p>Request: {{ text }}</p>
    <p>Generated Atmosphere Color: {{ color }}</p>
</div>
