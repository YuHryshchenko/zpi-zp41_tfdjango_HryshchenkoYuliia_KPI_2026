<div style="padding: 50px; text-align: center; min-height: 100vh;">
    <h1>Upload media</h1>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
    <p>Classification result: {{ prediction }}</p>
</div>
<div style="background-color: {{ color }}; padding: 50px; text-align: center; min-height: 100vh; transition: background 1s;">
    <h1>Atmosphere Generator</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="description" placeholder="Describe your mood..." value="{{ text }}">
        <button type="submit">Generate Color</button>
    </form>
    <p>Generated Atmosphere Color: {{ color }}</p>
</div>
