{% extends 'base.html' %}

{% block content %}

<div style="background-color: {{ color }}; min-height: 100vh; transition: 0.8s; padding-top: 50px;" id="creative-form">
    <div class="app-container" style="border-top: 8px solid #ffc107; background-color: #f0fff4; margin-top: 0px;">
        <h3 class="mb-4">🎨 Atmosphere Generator : Mood-to-Color AI</h3>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Renders form fields as paragraphs -->
            <button type="submit" class="btn btn-dark btn-lg w-100">Transform Atmosphere</button>
        </form>

        {% if text %}
        <div class="mt-4 card border-success">
            <div class="card-body">
                <div class="mt-4 text-center">
                    <small>Request: <code>{{ text }}</code></small>
                </div>
                <div class="mt-4 text-center">
                    <small>Generated Atmosphere Color: <code>{{ color }}</code></small>
                </div>
            </div>
        </div>
        {% endif %}
    </div>
</div>

{% endblock %}
