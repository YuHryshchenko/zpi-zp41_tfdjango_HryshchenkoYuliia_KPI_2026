{% extends 'base.html' %}

{% block content %}

{% load static %}
<link rel="stylesheet" href="{% static 'polls/style.css' %}">

<div class="container vote-container">
    <a href="{% url 'polls:index' %}" class="btn btn-link text-decoration-none text-muted mb-3">
        ← Back to Dashboard
    </a>

    <div class="card poll-card p-4 p-md-5">
        <form action="{% url 'polls:vote' question.id %}" method="post">
            {% csrf_token %}
            
            <div class="text-center mb-4">
                <span class="badge bg-info text-dark mb-2">Public Opinion Poll</span>
                <h2 class="fw-bold">{{ question.question_text }}</h2>
                <div class="bg-light p-1 mx-auto" style="width: 50px; height: 4px; border-radius: 2px;"></div>
            </div>

            {% if error_message %}
                <div class="alert alert-danger d-flex align-items-center" role="alert">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2" viewBox="0 0 16 16">
                        <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                    </svg>
                    <div>{{ error_message }}</div>
                </div>
            {% endif %}

            <fieldset class="mb-4">
                {% for choice in question.choice_set.all %}
                    <div class="form-check p-0">
                        <input class="form-check-input d-none" type="radio" name="choice" 
                               id="choice{{ forloop.counter }}" value="{{ choice.id }}">
                        
                        <label class="form-check-label w-100" for="choice{{ forloop.counter }}">
                            <div class="choice-item">
                                <div class="me-3 choice-action">
                                    <div class="rounded-circle border border-2 d-flex align-items-center justify-content-center" 
                                         style="width: 24px; height: 24px;">
                                        <div class="dot bg-info rounded-circle d-none" style="width: 12px; height: 12px;"></div>
                                    </div>
                                </div>
                                <div class="fs-5 choice-description">{{ choice.choice_text }}</div>
                            </div>
                        </label>
                    </div>
                {% endfor %}
            </fieldset>

            <button type="submit" class="btn btn-info btn-vote w-100 text-white shadow">
                Submit Vote
            </button>
        </form>
    </div>
</div>

<script>
    // Simple script to toggle visual "selected" state
    document.querySelectorAll('.form-check-input').forEach(input => {
        input.addEventListener('change', function() {
            // Reset all
            document.querySelectorAll('.choice-item').forEach(el => {
                el.style.borderColor = '#f1f5f9';
                el.style.backgroundColor = 'transparent';
                el.querySelector('.dot').classList.add('d-none');
            });
            // Highlight selected
            if (this.checked) {
                const item = this.nextElementSibling.querySelector('.choice-item');
                item.style.borderColor = '#0dcaf0';
                item.style.backgroundColor = '#e0f7fa';
                item.querySelector('.dot').classList.remove('d-none');
            }
        });
    });
</script>
{% endblock %}
