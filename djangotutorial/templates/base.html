<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Django + TensorFlow Project{% endblock %}</title>
    <!-- You can link project-wide CSS or static files here -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Global CSS or other head elements -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'polls/global.css' %}">
    <!-- Other head content specific to child pages can be added here using a block -->
    {% block extra_css %}{% endblock %}
    {% block extra_head %}{% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .app-container { max-width: 600px; margin: 50px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <header>
       {% include 'header.html' %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div align="center"><p>&copy; 2026 Yuliia Hryshchenko</p></div>
    </footer>

    <!-- Global JS files -->
    <script src="{% static 'js/global.js' %}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
